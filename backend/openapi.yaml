        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Ordens
      summary: Encerrar a OS (baixa) com data de entrega, lançamento financeiro opcional e notificação WhatsApp opcional.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        $ref: "#/components/requestBodies/CloseOrder"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /orcamentos:
    get:
      tags:
        - Orçamentos
      summary: Listar orçamentos.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          description: Filtro por status do orçamento.
          schema:
            type: string
        - name: tipo
          in: query
          description: Filtro por tipo do orçamento.
          schema:
            type: string
        - name: origem
          in: query
          description: Filtro por origem do orçamento.
          schema:
            type: string
      responses:
        "200":
          description: Lista paginada de orçamentos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          budgets:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          summary:
                            type: object
                            additionalProperties: true
                          status_options:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Orçamentos
      summary: Criar orçamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpsertInput"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /orcamentos/form-data:
    get:
      tags:
        - Orçamentos
      summary: Obter catálogos do formulário de orçamento.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /orcamentos/clientes:
    get:
      tags:
        - Orçamentos
      summary: Pesquisar clientes disponíveis para criação ou edição de orçamento.
      description: |
        Catálogo mínimo e paginado do Select2 de clientes. Exige
        `orcamentos:visualizar` e pelo menos uma das capacidades
        `orcamentos:criar` ou `orcamentos:editar`; não concede acesso ao módulo
        completo de clientes nem retorna CPF/CNPJ.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: per_page
          in: query
          description: Itens por página, limitado a 20 neste endpoint.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 15
        - $ref: "#/components/parameters/QParam"
      responses:
        "200":
          description: Página de opções mínimas de clientes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clients:
                            type: array
                            items:
                              $ref: "#/components/schemas/BudgetClientOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orcamentos/cliente-contexto:
    get:
      tags:
        - Orçamentos
      summary: OS abertas e equipamentos do cliente selecionado no orçamento.
      description: |
        Contexto dependente do cliente para o formulário de orçamento: as OS
        abertas (status fora do grupo_macro `encerrado`) que ainda não têm
        nenhum orçamento vinculado, e os equipamentos cadastrados daquele
        cliente, com o id da foto principal. Consumido de forma assíncrona
        quando o usuário troca o cliente no Select2, para que os campos "OS
        vinculada" e "Equipamento cadastrado" listem apenas o que pertence ao
        cliente. Exige `orcamentos:visualizar` e ao menos uma das capacidades
        `orcamentos:criar` ou `orcamentos:editar`.
      parameters:
        - name: cliente_id
          in: query
          required: true
          description: Identificador do cliente selecionado.
          schema:
            type: integer
            minimum: 1
        - name: orcamento_id
          in: query
          required: false
          description: |
            Orçamento em edição. Quando informado, a própria OS vinculada a
            este orçamento não é excluída da lista por já "ter orçamento" —
            o orçamento vinculado a ela é este mesmo.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OS abertas e equipamentos do cliente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items:
                              type: object
                          equipments:
                            type: array
                            items:
                              type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orcamentos/vinculaveis-os:
    get:
      tags:
        - Orçamentos
      summary: Pesquisar orçamentos aptos a gerar uma OS.
      description: |
        Catálogo mínimo, paginado e protegido pela permissão
        `orcamentos:converter_os` em conjunto com `os:criar`. Retorna
        orçamentos do tipo `previo` em todos os status, exceto `cancelado`,
        `rejeitado` e `convertido`, sempre sem `os_id`.

        Com `cliente_id` e `somente_aprovados=1` atende a abertura de OS a
        partir de um orçamento aprovado: escolhido o cliente, lista apenas os
        orçamentos dele que já foram autorizados. A OS criada com um desses
        orçamentos nasce em `aguardando_reparo`.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: per_page
          in: query
          description: Itens por página, limitado a 30 neste endpoint.
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 15
        - $ref: "#/components/parameters/QParam"
        - name: cliente_id
          in: query
          description: Restringe aos orçamentos de um cliente cadastrado.
          schema:
            type: integer
            minimum: 1
        - name: somente_aprovados
          in: query
          description: |
            Quando verdadeiro, retorna apenas orçamentos aprovados
            (`aprovado` e `pendente_abertura_os`).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Lista paginada de candidatos canônicos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          budgets:
                            type: array
                            items:
                              $ref: "#/components/schemas/LinkableBudgetSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orcamentos/vinculaveis-os/{budget}:
    get:
      tags:
        - Orçamentos
      summary: Obter contexto seguro de um orçamento apto a gerar OS.
      description: |
        Revalida o estado canônico no momento da leitura. A criação da OS faz
        uma segunda validação transacional com bloqueio pessimista. Exige
        `orcamentos:converter_os` e `os:criar`.
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      responses:
        "200":
          description: Contexto mínimo para pré-preenchimento da Nova OS.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          budget:
                            $ref: "#/components/schemas/LinkableBudgetDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orcamentos/{budget}:
    get:
      tags:
        - Orçamentos
      summary: Obter detalhe de um orçamento.
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Orçamentos
      summary: Atualizar orçamento.
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpsertInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - Orçamentos
      summary: Atualizar parcialmente um orçamento.
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpsertInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Orçamentos
      summary: Excluir orçamento.
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orcamentos/{budget}/send-approval:
    post:
      tags:
        - Orçamentos
      summary: Gerar PDF do orçamento e enviar para aprovação do cliente.
      description: |
        Persiste o disparo comercial do orçamento, gera o PDF privado, cria ou reaproveita
        o token público de decisão e tenta enviar o documento pelo canal configurado.
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mensagem:
                  type: string
                  nullable: true
                  description: Observação opcional para personalização futura do disparo.
      responses:
        "200":
          description: Disparo aceito com sucesso.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dispatch:
                            type: object
                            properties:
                              canal:
                                type: string
                                example: whatsapp
                              status:
                                type: string
                                example: enviado
                              destino:
                                type: string
                                example: "5511999999999"
                              public_url:
                                type: string
                                format: uri
                                example: "https://app.example.com/orcamento/token-publico"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /devolucoes:
    get:
      tags:
        - Devolucoes
      summary: Listar devolucoes.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: venda_id
          in: query
          schema:
            type: integer
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista paginada de devolucoes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devolucoes:
                            type: array
                            items:
                              $ref: "#/components/schemas/SaleReturnSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devolucoes/{devolucao}:
    parameters:
      - name: devolucao
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Devolucoes
      summary: Detalhar devolucao.
      responses:
        "200":
          description: Devolucao com itens e reembolsos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devolucao:
                            $ref: "#/components/schemas/SaleReturnDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /devolucoes/{devolucao}/comprovante:
    parameters:
      - name: devolucao
        in: path
        required: true
        schema:
          type: integer
      - name: formato
        in: query
        schema:
          type: string
          enum:
            - 80mm
            - a4
    get:
      tags:
        - Devolucoes
      summary: Comprovante da devolucao (documento nao fiscal).
      responses:
        "200":
          description: PDF do comprovante.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: DEVOLUCAO_COMPROVANTE_INDISPONIVEL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /vendas/{venda}/devolvivel:
    parameters:
      - name: venda
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Devolucoes
      summary: Saldo devolvivel da venda.
      description: >
        Quanto ainda pode voltar, por item, com o reembolso unitario ja
        proporcional ao desconto geral que a venda teve. Tambem informa se a
        venda esta fora do prazo livre e exige autorizacao.
      responses:
        "200":
          description: Itens com saldo devolvivel.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          venda:
                            type: object
                            additionalProperties: true
                          itens:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          exige_autorizacao:
                            type: boolean
                          prazo_livre_dias:
                            type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vendas/{venda}/devolucoes:
    parameters:
      - name: venda
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Devolucoes
      summary: Registrar devolucao (total ou parcial).
      description: >
        Devolve o estoque das pecas que baixaram na venda, cria o titulo a pagar
        "Devolucao de venda" e reembolsa pela mesma forma em que o dinheiro
        entrou, rateado entre os pagamentos originais. Devolucao em especie sai
        da gaveta do turno de caixa aberto no momento. A receita original NAO e
        estornada, e a despesa da taxa de cartao NAO e revertida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleReturnStoreInput"
      responses:
        "201":
          description: Devolucao registrada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devolucao:
                            $ref: "#/components/schemas/SaleReturnDetail"
                          idempotent_replay:
                            type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: DEVOLUCAO_IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >
            DEVOLUCAO_INVALIDA (venda cancelada, saldo devolvivel excedido,
            quantidade fracionada em item de estoque),
            DEVOLUCAO_ADMIN_AUTH_REQUIRED / DEVOLUCAO_ADMIN_AUTH_INVALID quando
            a venda esta fora do prazo livre, ou DEVOLUCAO_TROCA_INVALIDA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: DEVOLUCAO_ADMIN_AUTH_RATE_LIMITED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /caixa/atual:
    get:
      tags:
        - Caixa
      summary: Estado atual do caixa.
      description: >
        Devolve a sessão aberta, se houver, com os totais correntes do turno.
        O `valor_esperado` NÃO é devolvido enquanto o caixa está aberto — a
        conferência é cega. Antes da primeira abertura, `conta` e `sessao` vêm
        nulos: não é erro, é o estado inicial.
      responses:
        "200":
          description: Conta de caixa, sessão aberta e contas de destino para sangria.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          conta:
                            type: object
                            nullable: true
                            additionalProperties: true
                          sessao:
                            allOf:
                              - $ref: "#/components/schemas/CaixaSessaoDetail"
                            nullable: true
                          contas_destino:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /caixa:
    get:
      tags:
        - Caixa
      summary: Histórico de turnos.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - aberta
              - fechada
        - name: operador_id
          in: query
          schema:
            type: integer
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
        - name: com_diferenca
          in: query
          description: Só turnos fechados com diferença apurada diferente de zero.
          schema:
            type: boolean
      responses:
        "200":
          description: Lista paginada de turnos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessoes:
                            type: array
                            items:
                              $ref: "#/components/schemas/CaixaSessaoSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /caixa/abrir:
    post:
      tags:
        - Caixa
      summary: Abrir caixa.
      description: >
        Abre o turno com o troco declarado e alinha o saldo da conta de caixa a
        esse valor. A primeira abertura de todas cria a conta "Caixa da loja" e
        a define como padrão para dinheiro — ponto de adoção do módulo, e a
        partir dele o motor financeiro passa a exigir conta em toda baixa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - valor_abertura
              properties:
                valor_abertura:
                  type: number
                  minimum: 0
                observacoes:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Turno aberto.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessao:
                            $ref: "#/components/schemas/CaixaSessaoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: CAIXA_ABERTURA_INVALIDA — já existe um turno aberto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /caixa/{sessao}:
    parameters:
      - name: sessao
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Caixa
      summary: Detalhar turno.
      responses:
        "200":
          description: Turno com movimentos e totais.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessao:
                            $ref: "#/components/schemas/CaixaSessaoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CAIXA_SESSAO_NAO_ENCONTRADA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /caixa/{sessao}/movimentos:
    parameters:
      - name: sessao
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Caixa
      summary: Registrar sangria ou suprimento.
      description: >
        Sangria com `conta_destino_id` gera transferência real entre a conta de
        caixa e a conta informada; sem destino, é apenas uma saída ajustada no
        saldo da gaveta. Suprimento sempre entra como ajuste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tipo
                - valor
                - motivo
              properties:
                tipo:
                  type: string
                  enum:
                    - sangria
                    - suprimento
                valor:
                  type: number
                  minimum: 0.01
                motivo:
                  type: string
                  minLength: 3
                  maxLength: 255
                conta_destino_id:
                  type: integer
                  description: Só em sangria — para onde o dinheiro foi.
      responses:
        "201":
          description: Movimento registrado; devolve o turno atualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessao:
                            $ref: "#/components/schemas/CaixaSessaoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CAIXA_SESSAO_NAO_ENCONTRADA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >
            CAIXA_MOVIMENTO_INVALIDO — turno fechado, valor inválido ou sangria
            maior que o dinheiro em caixa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /caixa/{sessao}/abertura:
    parameters:
      - name: sessao
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - Caixa
      summary: Corrigir o valor de abertura.
      description: >
        Existe por causa da abertura automática, que herda o fechamento anterior
        e pode não bater com a gaveta. Ajusta o saldo da conta na mesma medida e
        limpa a marca de abertura automática.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - valor_abertura
              properties:
                valor_abertura:
                  type: number
                  minimum: 0
      responses:
        "200":
          description: Turno atualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessao:
                            $ref: "#/components/schemas/CaixaSessaoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: CAIXA_ABERTURA_INVALIDA — turno já fechado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /caixa/{sessao}/fechar:
    parameters:
      - name: sessao
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Caixa
      summary: Fechar caixa (conferência cega).
      description: >
        O cliente envia apenas o valor contado na gaveta. O esperado e a
        diferença são calculados pelo servidor e só então devolvidos — enviá-los
        na requisição é proibido, senão daria para "fechar sem diferença". A
        diferença apurada vira ajuste na conta, para o turno seguinte começar do
        dinheiro real.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - valor_informado
              properties:
                valor_informado:
                  type: number
                  minimum: 0
                observacoes:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Turno fechado, já com esperado e diferença revelados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessao:
                            $ref: "#/components/schemas/CaixaSessaoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CAIXA_SESSAO_NAO_ENCONTRADA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: CAIXA_FECHAMENTO_INVALIDO — turno já fechado ou valor ausente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /caixa/{sessao}/reabrir:
    parameters:
      - name: sessao
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Caixa
      summary: Reabrir turno fechado.
      description: >
        Descarta a conferência registrada — um fechamento reaberto não vale mais
        como conferência. Exige credencial de administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admin_email
                - admin_password
              properties:
                admin_email:
                  type: string
                  format: email
                admin_password:
                  type: string
                  format: password
      responses:
        "200":
          description: Turno reaberto.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessao:
                            $ref: "#/components/schemas/CaixaSessaoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            CAIXA_ADMIN_AUTH_REQUIRED, CAIXA_ADMIN_AUTH_INVALID ou
            CAIXA_REABERTURA_INVALIDA (já existe turno aberto).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: CAIXA_ADMIN_AUTH_RATE_LIMITED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /caixa/{sessao}/relatorio:
    parameters:
      - name: sessao
        in: path
        required: true
        schema:
          type: integer
      - name: formato
        in: query
        schema:
          type: string
          enum:
            - 80mm
            - a4
    get:
      tags:
        - Caixa
      summary: Relatório de fechamento do turno.
      responses:
        "200":
          description: PDF do relatório.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CAIXA_SESSAO_NAO_ENCONTRADA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: CAIXA_RELATORIO_INDISPONIVEL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /vendas:
    get:
      tags:
        - Vendas
      summary: Listar vendas de balcão.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          description: Situação da venda (concluida|cancelada).
          schema:
            type: string
        - name: status_pagamento
          in: query
          description: Situação do pagamento (pendente|parcial|pago).
          schema:
            type: string
        - name: vendedor_id
          in: query
          schema:
            type: integer
        - name: cliente_id
          in: query
          schema:
            type: integer
        - name: forma_pagamento
          in: query
          description: Código do catálogo de formas de pagamento.
          schema:
            type: string
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista paginada de vendas com totais do período.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vendas:
                            type: array
                            items:
                              $ref: "#/components/schemas/SaleSummary"
                          summary:
                            $ref: "#/components/schemas/SaleAggregate"
                          status_options:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          status_pagamento_options:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Vendas
      summary: Registrar venda de balcão.
      description: >
        Cria a venda, dá baixa no estoque das peças marcadas e lança o título a
        receber com as baixas. Operação atômica: falha em qualquer etapa desfaz
        todas. Venda concluída é imutável — não há update, a correção é o
        cancelamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleStoreInput"
      responses:
        "201":
          description: Venda registrada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          venda:
                            $ref: "#/components/schemas/SaleDetail"
                          idempotent_replay:
                            type: boolean
                            description: >
                              true quando a chave creation_request_id já havia
                              sido usada e a venda existente foi devolvida sem
                              nova gravação.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            VENDA_IDEMPOTENCY_CONFLICT — a chave creation_request_id já foi usada
            para outra venda (payload diferente ou outro usuário).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >
            VENDA_ESTOQUE_INSUFICIENTE quando falta saldo e
            confirmar_estoque_insuficiente não veio; error.details.itens traz
            peca_id, codigo, nome, disponivel e solicitado de cada ofensor.
            VENDA_INVALIDA para as demais violações de regra de negócio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

