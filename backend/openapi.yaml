    UpsertOrderRequest:
      type: object
      properties:
        orcamento_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Orçamento avulso disponível a vincular atomicamente. Quando
            informado, exige simultaneamente `os:criar` e
            `orcamentos:converter_os`; somente orçamento `previo`, sem OS
            vinculada e fora dos estados `cancelado`, `rejeitado` e
            `convertido` é aceito. Orçamentos ainda não aprovados permanecem
            abertos após o vínculo.

            O status inicial da OS acompanha o do orçamento e ignora o campo
            `status` da requisição: aprovado (`aprovado` ou
            `pendente_abertura_os`) abre em `aguardando_reparo`, os demais em
            `aguardando_orcamento` ou `aguardando_autorizacao`.
        cliente_id:
          type: integer
          minimum: 1
          nullable: true
          description: Obrigatório na criação quando `novo_cliente` não for informado.
        equipamento_id:
          type: integer
          minimum: 1
          nullable: true
          description: Obrigatório na criação quando `novo_equipamento` não for informado.
        novo_cliente:
          type: object
          nullable: true
          description: Cadastro diferido; só é persistido na transação que cria a OS.
          required:
            - nome_razao
            - telefone1
          properties:
            nome_razao:
              type: string
              maxLength: 100
            telefone1:
              type: string
              maxLength: 20
            email:
              type: string
              format: email
              maxLength: 100
              nullable: true
