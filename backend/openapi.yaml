              properties:
                document_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    minimum: 1
                channel:
                  type: string
                  enum: [whatsapp, email]
                  default: whatsapp
                format:
                  type: string
                  enum: [a4, 80mm]
                  default: a4
                destino:
                  type: string
                  nullable: true
                  example: cliente@empresa.com
                message:
                  type: string
                  nullable: true
                  example: Seguem os documentos da sua OS para acompanhamento.
                confirmar_destino_alternativo:
                  type: boolean
                  default: false
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
