        "403": { $ref: "#/components/responses/Forbidden" }

  /files:
    get:
      tags: [Gerenciador de Arquivos]
      summary: Listar somente metadados paginados do catálogo central.
      description: Nunca retorna storage_key, path absoluto ou bytes do arquivo.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: lifecycle_status
          in: query
          schema: { type: string, enum: [active, archived, trashed] }
        - name: integrity_status
          in: query
          schema: { type: string, enum: [unknown, valid, missing, corrupted] }
        - name: security_status
          in: query
          schema: { type: string, enum: [pending, clean, quarantined, rejected] }
        - name: migration_status
          in: query
          schema: { type: string, enum: [native, legacy, cataloged, migrating, migrated, failed] }
        - name: created_from
          in: query
          schema: { type: string, format: date }
        - name: created_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /files/download-batch:
    post:
      tags: [Gerenciador de Arquivos]
      summary: Baixar até 50 arquivos autorizados em um pacote ZIP temporário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_uuids]
              properties:
                file_uuids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: ZIP privado, temporário e limitado por quantidade e volume.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /files/trash-batch:
    post:
      tags: [Gerenciador de Arquivos]
      summary: Mover até 100 arquivos para a lixeira lógica com step-up administrativo.
      description: Preserva os binários para restauração e auditoria; não executa exclusão física.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_uuids, reason, admin_email, admin_password]
              properties:
                file_uuids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
                reason: { type: string, minLength: 10, maxLength: 500 }
                admin_email: { type: string, format: email, maxLength: 255 }
                admin_password: { type: string, format: password, maxLength: 200, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files/{fileUuid}:
    get:
      tags: [Gerenciador de Arquivos]
