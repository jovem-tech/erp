        id:
          type: integer
        nome:
          type: string
        ordem_exibicao:
          type: integer
        ativo:
          type: boolean

    FinanceiroCartaoTaxa:
      type: object
      properties:
        id:
          type: integer
        operadora_id:
          type: integer
        operadora_nome:
          type: string
          nullable: true
        bandeira_id:
          type: integer
          nullable: true
        bandeira_nome:
          type: string
          nullable: true
        modalidade:
          type: string
        parcelas_inicial:
          type: integer
        parcelas_final:
          type: integer
        taxa_percentual:
          type: number
        taxa_fixa:
          type: number
        prazo_recebimento_dias:
          type: integer
        observacoes:
          type: string
          nullable: true
        ativo:
          type: boolean

    FinanceiroGatewayTaxa:
      type: object
      properties:
        id:
          type: integer
        provider:
          type: string
        provider_label:
          type: string
        modalidade:
          type: string
        modalidade_label:
          type: string
        taxa_percentual:
          type: number
        taxa_fixa:
          type: number
        ordem_exibicao:
          type: integer
        observacoes:
          type: string
          nullable: true
        ativo:
          type: boolean
        catalog_description:
          type: string
          nullable: true

    WebhookWhatsappRequest:
      type: object
      additionalProperties: true
      description: Payload inbound recebido do gateway WhatsApp.

    Equipment:
      type: object
      properties:
        id:
          type: integer
        cliente_id:
          type: integer
        cliente_nome:
          type: string
        resumo_tecnico:
          type: string
        numero_serie:
          type: string
        imei:
          type: string
        desktop_modalidade:
          type: string
        status_operacional:
          type: string
        orders_count:
          type: integer
        primary_photo_id:
          type: integer
          nullable: true
        primary_photo_url:
          type: string
          nullable: true
        photos:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentPhoto"

    EquipmentPhoto:
      type: object
      properties:
        id:
          type: integer
        is_principal:
          type: boolean
        url:
          type: string

    StoreUserRequest:
      type: object
      required:
        - nome
        - email
        - password
        - perfil
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 255
        telefone:
          type: string
          maxLength: 20
          nullable: true
        perfil:
          type: string
          enum:
            - admin
            - tecnico
            - atendente
        grupo_id:
          type: integer
          minimum: 1
          nullable: true
        foto:
          type: string
          maxLength: 255
          nullable: true
        ativo:
          type: boolean
          nullable: true

    UpdateUserRequest:
      type: object
      description: Campos de usuário para atualização. Todos são opcionais e validados condicionalmente pelo backend.
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 255
          nullable: true
        telefone:
          type: string
          maxLength: 20
          nullable: true
        perfil:
          type: string
          enum:
            - admin
            - tecnico
            - atendente
        grupo_id:
          type: integer
          minimum: 1
          nullable: true
        foto:
          type: string
          maxLength: 255
          nullable: true
        ativo:
          type: boolean
          nullable: true

    UpdateUserActiveRequest:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean

    StoreGroupRequest:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 80
        descricao:
          type: string
          maxLength: 200
          nullable: true

    UpdateGroupRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 80
        descricao:
          type: string
          maxLength: 200
          nullable: true

    UpdateGroupPermissionsRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: object
          description: Matriz de permissões por módulo.
          additionalProperties:
            type: array
            items:
              type: string

    CreatePdfDocumentTemplateRequest:
      type: object
      required:
        - nome
        - tipo_base_codigo
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
          example: Termo de garantia especial
        descricao:
          type: string
          maxLength: 1000
          nullable: true
        tipo_base_codigo:
          type: string
          description: Fonte de dados segura registrada no motor de PDF.
          enum:
            - os_abertura
            - os_orcamento
            - os_laudo_tecnico
            - os_cobranca_manutencao
            - os_comprovante_entrega
            - os_devolucao_sem_reparo
            - os_encerramento

    ClonePdfDocumentTemplateRequest:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
          example: Laudo técnico para seguradora
        descricao:
          type: string
          maxLength: 1000
          nullable: true

    FileAdminActionPayload:
      type: object
      additionalProperties: false
      required: [reason, admin_email, admin_password]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
        admin_email:
          type: string
          format: email
          maxLength: 255
        admin_password:
          type: string
          format: password
          maxLength: 200
          writeOnly: true

  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
    ForgotPassword:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForgotPasswordRequest"
    ResetPassword:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResetPasswordRequest"
    UpdateProfile:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateProfileRequest"
    UpdatePassword:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdatePasswordRequest"
    UpsertOrder:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpsertOrderRequest"
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/UpsertOrderRequest"
    UpdateOrderStatus:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateOrderStatusRequest"
    CloseOrder:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CloseOrderRequest"
    ClientUpsert:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientUpsertRequest"
    SupplierUpsert:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupplierUpsertRequest"
    StoreUser:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StoreUserRequest"
    UpdateUser:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateUserRequest"
    UpdateUserActive:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateUserActiveRequest"
    StoreGroup:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StoreGroupRequest"
    UpdateGroup:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateGroupRequest"
    UpdateGroupPermissions:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateGroupPermissionsRequest"
    FileAdminAction:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FileAdminActionPayload"

  responses:
    Success:
      description: Resposta de sucesso no envelope padrão.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiSuccess"
    Created:
      description: Recurso criado com sucesso no envelope padrão.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiSuccess"
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Usuário autenticado sem permissão para o recurso.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Dados inválidos ou regra de entrada rejeitada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Estado atual ou kill switch impede a operação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Limite de requisições excedido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Falha inesperada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

paths:
  /knowledge/pdf-engine/templates:
    post:
      tags:
        - Conhecimento
      summary: Criar documento PDF personalizado.
      description: Cria uma família independente em rascunho com cabeçalho e rodapé institucionais. Exige conhecimento:editar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePdfDocumentTemplateRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /knowledge/pdf-engine/templates/{template}/clone:
    post:
      tags:
        - Conhecimento
      summary: Clonar documento PDF existente.
      description: Copia o rascunho atual ou a versão publicada para uma nova família independente em v1. Exige conhecimento:editar.
      parameters:
        - name: template
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClonePdfDocumentTemplateRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /health:
    get:
      tags:
        - Health
      summary: Verificar saúde da API.
      security: []
      responses:
        "200":
          description: API e banco disponíveis.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthData"
        "503":
          $ref: "#/components/responses/ServerError"

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Autenticar usuário.
      description: Emite token Bearer e dados do usuário autenticado.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          description: Login efetuado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password/forgot:
    post:
      tags:
        - Autenticação
      summary: Solicitar redefinição de senha.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/ForgotPassword"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServerError"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/password/reset:
    post:
      tags:
        - Autenticação
      summary: Redefinir senha com token.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/ResetPassword"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags:
        - Autenticação
      summary: Obter usuário autenticado.
      responses:
        "200":
          description: Usuário, grupo, módulos e permissões efetivas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags:
        - Autenticação
      summary: Atualizar perfil do usuário autenticado.
      requestBody:
        $ref: "#/components/requestBodies/UpdateProfile"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/password:
    put:
      tags:
        - Autenticação
      summary: Alterar senha do usuário autenticado.
      description: Revoga tokens e retorna `requires_relogin` quando a senha é alterada.
      requestBody:
        $ref: "#/components/requestBodies/UpdatePassword"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/photo:
    post:
      tags:
        - Autenticação
      summary: Cadastrar ou substituir a foto de perfil do usuário autenticado.
      description: >-
        Recebe uma imagem PNG, JPG ou WebP (até 4 MB), normaliza para JPEG
        512x512 e cataloga no Gerenciador de Arquivos central (categoria
        `user_profile_photo`, vinculada ao usuário). Substitui e remove a
        foto anterior, se existir.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo_file
              properties:
                photo_file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Foto salva com sucesso.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          has_photo:
                            type: boolean
                          preview_url:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Autenticação
      summary: Remover a foto de perfil do usuário autenticado.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/photo/image:
    get:
      tags:
        - Autenticação
      summary: Servir a foto de perfil atual do usuário autenticado.
      responses:
        "200":
          description: Arquivo de imagem (JPEG normalizado).
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/refresh:
    post:
      tags:
        - Autenticação
      summary: Renovar token autenticado.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags:
        - Autenticação
      summary: Revogar token atual.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /configuracoes/integracoes:
    get:
      tags:
        - Configurações
      summary: Obter o painel de integrações do desktop.
      responses:
        "200":
          description: Configurações atuais de integrações.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          integration:
                            $ref: "#/components/schemas/IntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Configurações
      summary: Atualizar o painel de integrações do desktop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationSettings"
      responses:
        "200":
          description: Configurações salvas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          integration:
                            $ref: "#/components/schemas/IntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /configuracoes/integracoes/testar-conexao:
    post:
      tags:
        - Configurações
      summary: Testar a conexão configurada com o provedor atual.
      responses:
        "200":
          description: Resultado do teste de conexão.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result:
                            $ref: "#/components/schemas/IntegrationActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /configuracoes/integracoes/enviar-teste:
    post:
      tags:
        - Configurações
      summary: Enviar mensagem de teste para o número cadastrado.
      responses:
        "200":
          description: Resultado do envio de teste.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result:
                            $ref: "#/components/schemas/IntegrationActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /configuracoes/integracoes/self-check-inbound:
    post:
      tags:
        - Configurações
      summary: Validar a rota inbound e a origem do gateway.
      responses:
        "200":
          description: Resultado do self-check inbound.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result:
                            $ref: "#/components/schemas/IntegrationActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /configuracoes/integracoes/gateway/status:
    post:
      tags:
        - Configurações
      summary: Consultar o estado do gateway configurado.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Configurações transitórias do gateway. Segredos devem trafegar no corpo da requisição, nunca na query string.
      responses:
        "200":
          description: Estado atual do gateway.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          gateway:
                            $ref: "#/components/schemas/IntegrationActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configuracoes/integracoes/gateway/qr:
    post:
      tags:
        - Configurações
      summary: Obter o QR code do gateway configurado.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Configurações transitórias do gateway. Segredos devem trafegar no corpo da requisição, nunca na query string.
      responses:
        "200":
          description: QR code atual do gateway.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          gateway:
                            $ref: "#/components/schemas/IntegrationActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configuracoes/integracoes/gateway/restart:
    post:
      tags:
        - Configurações
      summary: Reiniciar o gateway configurado.
      responses:
        "200":
          description: Resultado do restart do gateway.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          gateway:
                            $ref: "#/components/schemas/IntegrationActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configuracoes/integracoes/gateway/logout:
    post:
      tags:
        - Configurações
      summary: Encerrar a sessão do gateway configurado.
      responses:
        "200":
          description: Resultado do logout do gateway.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          gateway:
                            $ref: "#/components/schemas/IntegrationActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configuracoes/integracoes/gateway/start:
    post:
      tags:
