    post:
      tags:
        - Equipamentos
      summary: Criar equipamento completo com fotos e payload operacional.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - cliente_id
                - tipo_id
                - marca_id
                - modelo_id
                - fotos
              properties:
                cliente_id:
                  type: integer
                  minimum: 1
                tipo_id:
                  type: integer
                  minimum: 1
                marca_id:
                  type: integer
                  minimum: 1
                modelo_id:
                  type: integer
                  minimum: 1
                numero_serie:
                  type: string
                  nullable: true
                imei:
                  type: string
                  nullable: true
                senha_tipo:
                  type: string
                  enum: [desenho, texto]
                senha_acesso:
                  type: string
                  nullable: true
                  description: Segredo de acesso do equipamento. Em atualizações, valor vazio preserva o segredo já armazenado.
