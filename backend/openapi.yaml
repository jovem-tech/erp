                  type: string
                  nullable: true
                cor:
                  type: string
                  nullable: true
                cor_hex:
                  type: string
                  nullable: true
                cor_rgb:
                  type: string
                  nullable: true
                estado_fisico:
                  type: string
                  nullable: true
                observacoes:
                  type: string
                  nullable: true
                desktop_modalidade:
                  type: string
                  nullable: true
                  enum: [montado, oem]
                gabinete_tipo:
                  type: string
                  nullable: true
                gabinete_identificacao_status:
                  type: string
                  nullable: true
                  enum: [a_confirmar, manual, detectado]
                gabinete_observacao:
                  type: string
                  nullable: true
                placa_mae:
                  type: string
                  nullable: true
                chipset:
                  type: string
                  nullable: true
                processador:
                  type: string
                  nullable: true
                memoria_ram:
                  type: string
                  nullable: true
                armazenamento:
                  type: string
                  nullable: true
                placa_video:
                  type: string
                  nullable: true
                fonte_alimentacao:
                  type: string
                  nullable: true
                collector_pairing_code:
                  type: string
                  nullable: true
                foto_principal_index:
                  type: integer
                  minimum: 0
                  maximum: 3
                cadastro_pendente:
                  type: boolean
                  nullable: true
                  description: >-
                    Equipamento orçado antes de vir à assistência (aparelho ainda com o
                    cliente). Torna `fotos` opcional e marca o cadastro como incompleto;
                    a OS desse equipamento é recusada com
                    `ORDER_EQUIPMENT_REGISTRATION_PENDING` até uma foto ser anexada.
                    Ignorado quando `fotos` já vem no mesmo cadastro.
                fotos:
                  type: array
                  description: Obrigatório, com ao menos um item, exceto quando `cadastro_pendente` for verdadeiro.
                  maxItems: 4
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /equipments/{equipment}/reveal-password:
    post:
      tags:
        - Equipamentos
      summary: Revelar a senha de acesso do equipamento com confirmação de administrador.
      description: |
        Step-up authentication: qualquer usuário com acesso à visualização de
        equipamentos pode chamar, mas a senha só é retornada mediante
        `admin_email`/`admin_password` válidos de um usuário administrador
        ativo. Falha de credenciais retorna 422 (nunca 401 — ver padrão
        step-up do projeto) e é limitada a 5 tentativas por minuto por
        e-mail+IP. Cada revelação bem-sucedida é registrada em log de
        auditoria. Este é o ÚNICO caminho que expõe `senha_acesso` — o detalhe
        do equipamento sempre retorna o campo vazio.
      parameters:
        - $ref: "#/components/parameters/EquipmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admin_email
                - admin_password
              properties:
                admin_email:
                  type: string
                  format: email
                admin_password:
                  type: string
      responses:
        "200":
          description: Senha de acesso em texto claro (`data.senha_acesso`).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Muitas tentativas de verificação de administrador.

