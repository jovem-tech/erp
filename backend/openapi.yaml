  /file-manager/scan-runs:
    get:
      tags: [Gerenciador de Arquivos]
      summary: Listar execuções do scanner sem expor checkpoints sensíveis.
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, running, interrupted, completed, completed_with_errors, failed] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /file-manager/findings:
