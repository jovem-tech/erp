        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files/{fileUuid}/restore:
    post:
      tags: [Gerenciador de Arquivos]
      summary: Restaurar lifecycle com step-up de administrador.
      parameters:
        - name: fileUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { $ref: "#/components/requestBodies/FileAdminAction" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files/{fileUuid}/quarantine:
    post:
      tags: [Gerenciador de Arquivos]
      summary: Colocar em quarentena com step-up de administrador.
      parameters:
        - name: fileUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { $ref: "#/components/requestBodies/FileAdminAction" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /files/{fileUuid}/release-quarantine:
    post:
      tags: [Gerenciador de Arquivos]
      summary: Liberar quarentena após validação e step-up de administrador.
      parameters:
        - name: fileUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FileAdminActionPayload"
                - type: object
                  required: [validation_reference]
                  properties:
                    validation_reference: { type: string, minLength: 3, maxLength: 120 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups:
    get:
      tags: [Backup e Restauração]
      summary: Listar o catálogo de backups.
      description: >
        Inclui backups gerados fora deste sistema (cron de root, pré-deploy,
        manuais). Nunca retorna o caminho absoluto do arquivo no servidor.
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 5, maximum: 100, default: 20 }
        - name: origem
          in: query
          schema: { type: string, enum: [painel, agendado, cron_legado, pre_deploy, manual] }
        - name: conteudo
          in: query
          schema: { type: string, enum: [completo, somente_banco] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Backup e Restauração]
      summary: Enfileirar um backup completo.
      description: >
        Apenas grava a solicitação; a execução ocorre pelo scheduler em até 60s.
        O pool PHP-FPM corta em 60s, então um backup jamais roda na requisição.
        Requer frase secreta configurada e ambiente sem bloqueios de preflight.
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups/resumo:
    get:
      tags: [Backup e Restauração]
      summary: Painel de situação (último backup, agenda, saúde do ambiente).
      description: >
        `alerta_sem_backup_completo` indica que só existem cópias "somente banco"
        — nenhuma imagem ou documento de cliente está protegido.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /backups/varrer:
    post:
      tags: [Backup e Restauração]
      summary: Catalogar no painel os backups presentes no disco.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups/configuracoes:
    get:
      tags: [Backup e Restauração]
      summary: Ler agenda, retenção e destinos. Segredos vêm mascarados.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Backup e Restauração]
      summary: Atualizar agenda e retenção.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backup_agendado_habilitado: { type: boolean }
                backup_horario: { type: string, pattern: '^\d{2}:\d{2}$' }
                backup_retencao_diarios: { type: integer, minimum: 0, maximum: 365 }
                backup_retencao_semanais: { type: integer, minimum: 0, maximum: 104 }
                backup_retencao_mensais: { type: integer, minimum: 0, maximum: 120 }
                backup_retencao_minimo_copias: { type: integer, minimum: 1, maximum: 50 }
                backup_incluir_banco_chat: { type: boolean }
                backup_incluir_legado: { type: boolean }
                backup_incluir_config: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups/frase-secreta:
    post:
      tags: [Backup e Restauração]
      summary: Definir ou trocar a frase secreta do backup.
      description: >
        A frase nunca é devolvida. A resposta traz apenas a impressão
        (`fingerprint`), que permite identificar pacotes gerados com outra frase.
        Perder a frase torna todos os backups irrecuperáveis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frase, frase_confirmation]
              properties:
                frase: { type: string, minLength: 12, maxLength: 200 }
                frase_confirmation: { type: string, minLength: 12, maxLength: 200 }
                modo: { type: string, enum: [armazenada, manual], default: armazenada }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups/{uuid}:
    get:
      tags: [Backup e Restauração]
      summary: Detalhe de um backup, incluindo progresso e avisos.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Backup e Restauração]
      summary: Excluir o arquivo de um backup, mantendo o registro no histórico.
      description: >
        Recusa backups fixados e os criados fora do sistema — estes vivem em
        diretório de root e têm retenção própria do cron do servidor.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups/{uuid}/link-download:
    post:
      tags: [Backup e Restauração]
      summary: Obter URL assinada temporária para baixar o pacote.
      description: >
        Devolve um link de 10 minutos em vez dos bytes. O pacote tem ~130 MB e
        não pode trafegar pelo BFF do desktop, que carrega o corpo inteiro em
        memória. Permissão `backups:baixar` é separada de `backups:visualizar`
        porque o pacote contém todos os segredos e arquivos de clientes.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups/{uuid}/verificar:
    post:
      tags: [Backup e Restauração]
      summary: Conferir a integridade de um backup sem restaurar nada.
      description: >
        Para pacotes completos, confere o sha256 de cada membro contra o
        manifesto. Para dumps simples, confere o gzip e o rodapé
        "-- Dump completed" — `gzip -t` sozinho passa em dump truncado.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups/{uuid}/proteger:
    post:
      tags: [Backup e Restauração]
      summary: Fixar ou desafixar um backup contra a retenção automática.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                protegido: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /fiscal/anexo-x:
    get:
      tags: [Fiscal]
      summary: Anexo X — Relatório Mensal das Receitas Brutas do MEI.
      description: >
        Res. CGSN nº 140/2018, art. 106. Devolve as dez linhas do formulário
        oficial, o drill-down das operações, o acumulado do ano contra o limite
        do MEI e a receita que ficou sem documento fiscal. Se a competência
        estiver encerrada, devolve os valores CONGELADOS
        (`origem_dos_valores = fechamento`); `reconferir=1` recalcula ao vivo
        para comparar com o que foi declarado, sem descongelar nada.
        O total (linha X) é sempre igual à receita líquida do DRE do mesmo mês
        e regime.
      parameters:
        - name: competencia
          in: query
          required: false
          description: Competência AAAA-MM. Ausente ou malformada, usa o mês corrente.
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: regime
          in: query
          required: false
          schema: { type: string, enum: [competencia, caixa], default: competencia }
        - name: reconferir
          in: query
          required: false
          description: Recalcula um mês encerrado para expor divergências em `fechamento.divergencias`.
          schema: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /fiscal/anexo-x/pdf:
    get:
      tags: [Fiscal]
      summary: PDF do formulário oficial do Anexo X — um mês ou o ano inteiro.
      description: >
        Apenas o formulário, exatamente como a norma o desenha. Acumulado do
        ano, receita sem documento fiscal e relação de notas emitidas NÃO
        entram: o Anexo X é um modelo padronizado pela Receita Federal e não se
        modifica. O regime usado sai impresso no rodapé.


        Com `ano=AAAA`, devolve o bloco anual: uma folha por mês, de janeiro a
        dezembro, cada uma sendo o MESMO formulário do PDF mensal (as duas
        saídas incluem o mesmo partial Blade). `ano` tem precedência sobre
        `competencia` — pedir doze meses e receber um só passaria despercebido.
        Meses já encerrados saem pelos valores congelados; meses em curso ou
        futuros saem com aviso no rodapé para não serem assinados por engano.
      parameters:
        - name: competencia
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: ano
          in: query
          required: false
          description: Ano-calendário do bloco anual. Presente e válido, manda no `competencia`.
          schema: { type: string, pattern: '^\d{4}$' }
        - name: regime
          in: query
          required: false
          schema: { type: string, enum: [competencia, caixa], default: competencia }
      responses:
        "200":
          description: Bytes do PDF (inline).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /fiscal/anexo-x/documentos/pdf:
    get:
      tags: [Fiscal]
      summary: PDF da relação de documentos fiscais emitidos no mês.
      description: >
        Arquivo SEPARADO do formulário — é o anexo que a última cláusula do
        Anexo X manda juntar ao relatório, não uma seção dele. Lista por DATA DE
        EMISSÃO, enquanto as colunas II/V/VIII do formulário classificam a
        OPERAÇÃO: uma nota emitida no mês seguinte ao da operação aparece aqui
        num mês e lá em outro. Canceladas entram identificadas, para não abrir
        buraco na sequência numérica.
      parameters:
        - name: competencia
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        "200":
          description: Bytes do PDF (inline).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /fiscal/anexo-x/fechamento:
    post:
      tags: [Fiscal]
      summary: Encerrar a competência, congelando os valores declarados.
      description: >
        Exige `fiscal:encerrar`. Grava um retrato do relatório (as dez linhas
        como colunas, o payload completo e um sha256 de detecção de
        adulteração). Depois disso, lançamento retroativo não altera mais o
        relatório — que é o ponto, já que ele foi assinado e arquivado.
        Competência e caixa fecham de forma independente. Diferente das rotas de
        leitura, competência malformada é RECUSADA em vez de cair no mês
        corrente: um querystring torto não pode congelar o mês errado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competencia]
              properties:
                competencia: { type: string, pattern: '^\d{4}-\d{2}$' }
                regime: { type: string, enum: [competencia, caixa], default: competencia }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >
            `ANEXO_X_COMPETENCIA_INVALIDA` (formato) ou `ANEXO_X_JA_FECHADO`
            (competência já encerrada neste regime).

  /fiscal/anexo-x/fechamento/reabertura:
    post:
      tags: [Fiscal]
      summary: Reabrir uma competência encerrada.
      description: >
        Exige `fiscal:encerrar` MAIS confirmação de credencial de
        administrador — reabrir período já declarado ao fisco é da mesma classe
        de ato que reabrir um caixa fechado. A versão vigente é marcada como
        reaberta e permanece no banco como evidência; o próximo encerramento
        grava `versao + 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competencia, motivo, admin_email, admin_password]
              properties:
                competencia: { type: string, pattern: '^\d{4}-\d{2}$' }
                regime: { type: string, enum: [competencia, caixa], default: competencia }
                motivo: { type: string, minLength: 10 }
                admin_email: { type: string, format: email }
                admin_password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >
            `ANEXO_X_COMPETENCIA_INVALIDA`, `ANEXO_X_MOTIVO_OBRIGATORIO`,
            `ANEXO_X_ADMIN_AUTH_REQUIRED`, `ANEXO_X_ADMIN_AUTH_INVALID`,
            `ANEXO_X_ADMIN_AUTH_RATE_LIMITED` ou `ANEXO_X_SEM_FECHAMENTO`.

  /fiscal/anexo-x/resumo:
    get:
      tags: [Fiscal]
      summary: Os doze meses do Anexo X nos dois regimes — a grade da tela do ano.
      description: >
        Devolve sempre 12 itens (janeiro a dezembro), cada um com as dez linhas
        do formulário nos regimes de competência E de caixa, mais as colunas
        derivadas (total, comércio, indústria, serviços, com documento, sem
        documento) e o resumo do fechamento. Traz também o acumulado do ano, os
        totais e a série do gráfico.


        Passa pelo MESMO pipeline de `GET /fiscal/anexo-x` — a tabela do ano e o
        modal de um mês não podem discordar. Mês encerrado vem dos valores
        congelados, sem reapurar.


        `regime_que_conta_para_o_limite` é sempre `competencia`: o teto do MEI é
        sobre a receita bruta AUFERIDA no ano-calendário, e o regime de caixa é
        opção do ME/EPP exercida no PGDAS-D, que o MEI não usa.
      parameters:
        - name: ano
          in: query
          required: false
          description: Ano-calendário. Ausente ou fora da faixa, usa o ano corrente.
          schema: { type: string, pattern: '^\d{4}$' }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /fiscal/anexo-x/ajustes:
    get:
      tags: [Fiscal]
      summary: Ajustes manuais declarados numa competência.
      description: >
        Lista os lançamentos, inclusive os cancelados (que continuam na trilha,
        marcados), e diz se a competência está bloqueada por encerramento.
      parameters:
        - name: competencia
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: regime
          in: query
          required: false
          schema: { type: string, enum: [competencia, caixa], default: competencia }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Fiscal]
      summary: Lança um ajuste manual numa linha do formulário.
      description: >
        Exige `fiscal:editar`. O ajuste é SOMADO ao valor apurado, nunca o
        substitui: `linhas[x].calculado` continua sendo o que o sistema apurou,
        `linhas[x].ajuste` é a soma dos lançamentos e `linhas[x].valor` é o
        declarado. Existe porque o Anexo X tem que declarar toda a receita
        bruta, inclusive a que nunca passou pelo ERP.


        Só as SEIS linhas-folha aceitam ajuste (I, II, IV, V, VII, VIII). III,
        VI, IX e X são somas — ajustá-las exigiria repartir o valor de volta, e
        essa repartição é decisão fiscal que só quem lança sabe tomar.


        O lançamento é imutável: corrigir é cancelar e lançar de novo. Toda
        recusa é explícita, sem fallback silencioso — lançar receita na
        competência errada é declaração errada ao fisco.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competencia, linha, valor, motivo]
              properties:
                competencia: { type: string, pattern: '^\d{4}-\d{2}$' }
                regime: { type: string, enum: [competencia, caixa], default: competencia }
                linha: { type: string, enum: [i, ii, iv, v, vii, viii] }
                valor:
                  type: number
                  description: Com sinal — positivo acrescenta, negativo reduz. Zero é recusado.
                motivo: { type: string, minLength: 10, maxLength: 500 }
                aplicar_no_outro_regime:
                  type: boolean
                  description: Cria o lançamento gêmeo no outro regime, para as duas leituras não discordarem.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >
            `ANEXO_X_COMPETENCIA_INVALIDA`, `ANEXO_X_LINHA_NAO_AJUSTAVEL`,
            `ANEXO_X_AJUSTE_VALOR_INVALIDO`, `ANEXO_X_MOTIVO_OBRIGATORIO` ou
            `ANEXO_X_COMPETENCIA_FECHADA`.

  /fiscal/anexo-x/ajustes/{ajuste}/cancelamento:
    post:
      tags: [Fiscal]
      summary: Cancela um ajuste manual.
      description: >
        Exige `fiscal:editar`. Não apaga: o lançamento sai da apuração e
        continua listado, riscado, com quem cancelou e por quê — o produto aqui
        é a trilha de quem declarou o quê e quando.
      parameters:
        - name: ajuste
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 10, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`ANEXO_X_MOTIVO_OBRIGATORIO` ou `ANEXO_X_COMPETENCIA_FECHADA`."
