  /vendas/{venda}/cancelar:
    parameters:
      - name: venda
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Vendas
      summary: Cancelar venda.
      description: >
        Devolve os produtos ao estoque (com movimentação de entrada, sem apagar
        a saída original) e cancela o título financeiro, estornando movimentos e
        despesas de taxa de cartão derivadas. Venda de data anterior à de hoje
        exige credencial de administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motivo
              properties:
                motivo:
                  type: string
                  minLength: 5
                  maxLength: 2000
                admin_email:
                  type: string
                  format: email
                  description: Obrigatório quando a venda não é do dia corrente.
                admin_password:
                  type: string
                  format: password
      responses:
        "200":
          description: Venda cancelada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          venda:
                            $ref: "#/components/schemas/SaleDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            VENDA_ADMIN_AUTH_REQUIRED, VENDA_ADMIN_AUTH_INVALID ou
            VENDA_CANCELAMENTO_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: VENDA_ADMIN_AUTH_RATE_LIMITED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

