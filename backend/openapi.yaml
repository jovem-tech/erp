  /agenda:
    get:
      tags:
        - Agenda
      summary: Listar compromissos da agenda.
      description: >
        Devolve os compromissos que se sobrepõem à janela pedida. Sem a
        permissão `agenda:ver_todos`, a lista traz apenas os do próprio usuário
        e os que ainda não têm responsável. Exige agenda:visualizar.
      parameters:
        - name: de
          in: query
          description: Início da janela (Y-m-d). Padrão, primeiro dia do mês corrente.
          schema:
            type: string
            format: date
        - name: ate
          in: query
          description: Fim da janela (Y-m-d). Limitado a 400 dias após `de`.
          schema:
            type: string
            format: date
        - name: tipo
          in: query
          description: "Chave do tipo: `manual` ou a chave de uma fonte automática (`conta_pagar`, `retorno_pos_servico`, ...)."
          schema:
            type: string
        - name: status
          in: query
          description: Sem filtro, cancelados ficam de fora.
          schema:
            type: string
            enum: [pendente, concluido, cancelado]
        - name: responsavel_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Compromissos da janela e catálogo de tipos disponíveis.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          compromissos:
                            type: array
                            items:
                              $ref: "#/components/schemas/AgendaCompromisso"
                          tipos:
                            type: array
                            items:
                              type: object
                              properties:
                                key: { type: string }
                                label: { type: string }
                                icon: { type: string }
                          pode_ver_todos:
                            type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Agenda
      summary: Criar compromisso manual.
      description: >
        Cria um compromisso do tipo `manual`. Sem `responsavel_id`, o autor
        assume a responsabilidade. Exige agenda:criar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaCompromissoRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agenda/resumo:
    get:
      tags:
        - Agenda
      summary: Resumo da agenda (atrasados, hoje, próximos 7 dias).
      description: Alimenta a barra de estado da tela de Agenda e o card do dashboard. Exige agenda:visualizar.
      responses:
        "200":
          description: Contadores e os próximos compromissos em aberto.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          atrasados: { type: integer }
                          hoje: { type: integer }
                          proximos_7_dias: { type: integer }
                          proximos:
                            type: array
                            items:
                              $ref: "#/components/schemas/AgendaCompromisso"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /agenda/{compromisso}:
    parameters:
      - name: compromisso
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - Agenda
      summary: Atualizar compromisso.
      description: >
        Em compromisso gerido por uma fonte automática (`gerido: true`), apenas
        `descricao`, `prioridade` e `lembrete_minutos` são aplicados — título e
        data pertencem ao módulo de origem e seriam desfeitos na próxima
        reconciliação. Exige agenda:editar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaCompromissoRequest"
      responses:
        "200":
          description: Compromisso atualizado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Agenda
      summary: Excluir compromisso manual.
      description: >
        Compromisso gerido não pode ser excluído (422 `AGENDA_DELETE_BLOCKED`):
        ele voltaria na próxima reconciliação, porque a obrigação de origem
        continua existindo. Exige agenda:excluir.
      responses:
        "200":
          description: Compromisso excluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agenda/{compromisso}/concluir:
    post:
      tags:
        - Agenda
      summary: Concluir compromisso.
      description: Exige agenda:editar.
      parameters:
        - name: compromisso
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compromisso concluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /agenda/{compromisso}/reabrir:
    post:
      tags:
        - Agenda
      summary: Reabrir compromisso concluído.
      description: Exige agenda:editar.
      parameters:
        - name: compromisso
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compromisso reaberto.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /agenda/google/status:
    get:
      tags:
        - Agenda
      summary: Estado da conexão com o Google Agenda.
      description: >
        Credenciais mascaradas, calendário dedicado, conta conectada e resultado
        da última sincronização. Exige configuracoes:visualizar.
      responses:
        "200":
          description: Estado da integração.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /agenda/google/credenciais:
    post:
      tags:
        - Agenda
      summary: Salvar Client ID e Client Secret do Google.
      description: >
        Campo de segredo enviado vazio preserva o valor atual. Exige
        configuracoes:editar.
      responses:
        "200":
          description: Credenciais salvas.
        "403":
          $ref: "#/components/responses/Forbidden"

  /agenda/google/conectar:
    post:
      tags:
        - Agenda
      summary: Iniciar o consentimento OAuth.
      description: >
        Devolve a URL de consentimento e um `state` de uso único (TTL 15 min).
        O escopo pedido é `calendar.app.created`, que autoriza o app a ver e
        editar apenas calendários criados por ele mesmo — os calendários
        pessoais da conta permanecem inacessíveis. Exige configuracoes:editar.
      responses:
        "200":
          description: URL de autorização.
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agenda/google/callback:
    get:
      tags:
        - Agenda
      summary: Retorno do consentimento do Google (página HTML).
      description: >
        Rota pública, fora de `auth:sanctum`: quem chega aqui é o navegador
        redirecionado pelo Google, sem o Bearer token do desktop. A autenticação
        da chamada é o `state` de uso único emitido em `/agenda/google/conectar`.
        Troca o `code` pelo refresh token e cria o calendário dedicado.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Página HTML de confirmação (fecha sozinha).
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Autorização inválida, expirada ou cancelada.

  /agenda/google/conectar-manual:
    post:
      tags:
        - Agenda
      summary: Conectar colando um refresh token obtido por fora.
      description: >
        Saída para ambientes em que o Google recusa o redirect URI (IP privado
        não é aceito no Cloud Console). Valida o token antes de gravar. Exige
        configuracoes:editar.
      responses:
        "200":
          description: Conectado.
        "422":
          $ref: "#/components/responses/ValidationError"

  /agenda/google/desconectar:
    post:
      tags:
        - Agenda
      summary: Desconectar do Google.
      description: >
        Limpa credenciais de sessão e os vínculos locais de evento. O calendário
        e os eventos permanecem na conta Google. Exige configuracoes:editar.
      responses:
        "200":
          description: Desconectado.
        "403":
          $ref: "#/components/responses/Forbidden"

  /agenda/google/sincronizar:
    post:
      tags:
        - Agenda
      summary: Sincronizar agora (push e pull).
      description: Exige agenda:visualizar.
      responses:
        "200":
          description: Estatísticas da sincronização.
        "422":
          $ref: "#/components/responses/ValidationError"

  /dashboard/summary:
    get:
      tags:
        - Dashboard
      summary: Obter resumo agregado do dashboard.
      parameters:
        - name: ano
          in: query
          description: Ano de referência do dashboard.
          schema:
            type: integer
        - name: equip_mes
          in: query
          description: Mês de referência para indicadores de equipamentos.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: equip_ano
          in: query
          description: Ano de referência para indicadores de equipamentos.
          schema:
            type: integer
      responses:
        "200":
          description: Sumário do dashboard.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /conversas:
    get:
      tags:
        - Central de Atendimento
      summary: Listar conversas da Central de Atendimento.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/NotificationBox"
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          description: Filtra por status da conversa.
          schema:
            type: string
            enum: [open, resolved, pending, snoozed]
        - name: unread_only
          in: query
          description: Quando verdadeiro, retorna apenas conversas com mensagens recebidas ainda não lidas.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Lista paginada de conversas com preview da última mensagem e contador de não lidas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ConversationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Central de Atendimento
      summary: Iniciar conversa por cliente do sistema_hml ou por telefone livre.
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StartConversationRequest"
            encoding:
              attachments:
                style: form
                explode: true
      responses:
        "201":
          description: Conversa criada ou reaproveitada, com mensagem inicial opcional.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          conversation:
                            $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversas/{conversation}:
    get:
      tags:
        - Central de Atendimento
      summary: Detalhe de uma conversa, com histórico de mensagens. Marca a conversa como lida.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Detalhe da conversa.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          conversation:
                            $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sem acesso a esta conversa.
        "404":
          $ref: "#/components/responses/NotFound"

  /conversas/{conversation}/mensagens:
    post:
      tags:
        - Central de Atendimento
      summary: Enviar uma mensagem com texto, anexos ou ambos numa conversa.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SendConversationMessageRequest"
            encoding:
              attachments:
                style: form
                explode: true
      responses:
        "201":
          description: Mensagem criada com status inicial `pending`, atualizada de forma assíncrona após o provider responder.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sem acesso a esta conversa.
        "422":
          $ref: "#/components/responses/ValidationError"

  /chat/clientes/search:
    get:
      tags:
        - Central de Atendimento
      summary: Buscar clientes do sistema_hml para iniciar conversa no chat.
      parameters:
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: Lista enxuta de clientes e telefones disponíveis para o atendimento.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clients:
                            type: array
                            items:
                              $ref: "#/components/schemas/ChatClientSearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /chat/anexos/{attachment}:
    get:
      tags:
        - Central de Atendimento
      summary: Fazer download ou preview autenticado de um anexo privado do chat.
      description: >
        A autorização é validada pela conversa e pela conta de atendimento. Somente imagens raster
        aprovadas podem ser exibidas inline. Demais tipos são enviados como attachment; conteúdo
        desconhecido usa application/octet-stream. A resposta sempre aplica nosniff e no-store.
      parameters:
        - $ref: "#/components/parameters/ChatAttachmentId"
      responses:
        "200":
          description: Conteúdo binário do anexo.
          headers:
            Content-Disposition:
              description: "`inline` apenas para raster aprovado; `attachment` para os demais tipos."
              schema:
                type: string
            X-Content-Type-Options:
              description: Sempre `nosniff`.
              schema:
                type: string
                enum: [nosniff]
            Cache-Control:
              description: Resposta privada sem armazenamento em cache.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            "image/*":
              schema:
                type: string
                format: binary
            "audio/*":
              schema:
                type: string
                format: binary
            "video/*":
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sem acesso a este anexo.
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications:
    get:
      tags:
        - Notificações
      summary: Listar notificações do usuário autenticado.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: only_unread
          in: query
          description: Quando verdadeiro, retorna apenas notificações não lidas.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Lista paginada de notificações.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Notification"
                          unread_count:
                            type: integer
                          last_notification_id:
                            type: integer
                            minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{notification}/read:
    patch:
      tags:
        - Notificações
      summary: Marcar uma notificação como lida.
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/read-all:
    patch:
      tags:
        - Notificações
      summary: Marcar todas as notificações como lidas.
      parameters:
        - $ref: "#/components/parameters/NotificationBox"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/read:
    delete:
      tags:
        - Notificações
      summary: Remover todas as notificações já lidas do usuário autenticado.
      parameters:
        - $ref: "#/components/parameters/NotificationBox"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders:
    get:
      tags:
        - Ordens
      summary: Listar ordens de serviço.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: status_scope
          in: query
          description: Escopo opcional da fila operacional. Use `open` para ocultar OS encerradas pelos códigos canônicos (`entregue_reparado`, `devolvido_sem_reparo`, `descartado`) e entregas com cobrança pendente já vinculadas a um encerramento; use `all` para remover esse recorte.
          schema:
            type: string
            enum:
              - open
              - all
        - name: status
          in: query
          description: Filtro por status.
          schema:
            type: string
        - name: technician_id
          in: query
          description: Filtro por técnico responsável (ignorado quando o usuário autenticado já é técnico, que só vê as próprias OS).
          schema:
            type: integer
        - name: client_id
          in: query
          description: Filtro por cliente.
          schema:
            type: integer
        - name: equipment_id
          in: query
          description: Filtro por equipamento.
          schema:
            type: integer
        - name: grupo_macro
          in: query
          description: Filtro pela macrofase do status (os_status.grupo_macro).
          schema:
            type: string
        - name: data_abertura_de
          in: query
          description: Filtro de data_abertura a partir de (inclusive).
          schema:
            type: string
            format: date
        - name: data_abertura_ate
          in: query
          description: Filtro de data_abertura até (inclusive).
          schema:
            type: string
            format: date
        - name: valor_min
          in: query
          description: Filtro de valor_final mínimo.
          schema:
            type: number
        - name: valor_max
          in: query
          description: Filtro de valor_final máximo.
          schema:
            type: number
        - name: sort
          in: query
          description: Ordenação quando suportada pelo backend.
          schema:
            type: string
      responses:
        "200":
          description: Lista paginada de OS.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items:
                              $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Ordens
      summary: Criar ordem de serviço.
      requestBody:
        $ref: "#/components/requestBodies/UpsertOrder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/status-catalog:
    get:
      tags:
        - Ordens
      summary: Listar status ativos de OS para filtros e selects operacionais.
      description: |
        Retorna apenas o catálogo ativo de status de OS necessário para telas operacionais
        como a listagem `/os`. Exige `os:visualizar` e não expõe a configuração completa
        de transições do módulo de conhecimento.
      responses:
        "200":
          description: Catálogo de status ativos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          statuses:
                            type: array
                            items:
                              $ref: "#/components/schemas/OrderWorkflowStatusOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/{order}:
    get:
      tags:
        - Ordens
      summary: Obter detalhe de uma OS.
      description: |
        Retorna o detalhe completo da OS, incluindo `eventos` — a timeline
        unificada e auditável de movimentações (tabela `os_eventos`, máximo de
        200 itens, mais recentes primeiro). Cada evento tem `categoria`
        (`status` | `orcamento` | `financeiro` | `documento` | `mensagem` |
        `registro`), `tipo` (slug do catálogo em `App\Models\OrderEvent`),
        `titulo`, `descricao`, `dados` (payload JSON auditável), `origem`
        (`sistema` | `usuario` | `cliente` | `automacao`), `usuario` e
        `created_at`. Os campos legados `historico` (status, 5 itens) e
        `procedimentos_historico` (20 itens) continuam presentes e inalterados.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Ordens
      summary: Atualizar OS.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        $ref: "#/components/requestBodies/UpsertOrder"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - Ordens
      summary: Atualizar parcialmente uma OS.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        $ref: "#/components/requestBodies/UpsertOrder"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders/{order}/photos/{photo}:
    get:
      tags:
        - Ordens
      summary: Servir foto autenticada da OS.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Arquivo de imagem.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /document-signatures/{signatureRequest}/preview:
    get:
      tags:
        - Assinaturas
      summary: Renderiza e registra a revisão da prévia antes da assinatura
      parameters:
        - name: signatureRequest
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: PDF A4 privado, sem assinatura e sem persistência no acervo.
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, no-store, max-age=0
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Usuário sem acesso à solicitação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Solicitação expirada, processada ou OS alterada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /document-signatures/{signatureRequest}/sign:
    post:
      tags:
        - Assinaturas
      summary: Assina e emite um documento previamente revisado
      parameters:
        - name: signatureRequest
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - review_confirmed
              properties:
                review_confirmed:
                  type: boolean
                  description: Confirmação explícita de leitura da prévia.
                  example: true
                signature_email:
                  type: string
                  format: email
                  nullable: true
                signature_password:
                  type: string
                  format: password
                  nullable: true
      responses:
        "200":
          description: Documento assinado e emitido.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "422":
          description: Revisão ausente/expirada ou credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/{order}/documents:
    get:
      tags:
        - Ordens
      summary: Listar central documental versionada da OS.
      description: Retorna catálogo de tipos documentais, versões já geradas, histórico resumido de envios e links públicos da ordem de serviço.
      parameters:
