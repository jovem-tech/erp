server {
    listen 8444 ssl;
    server_name 192.168.1.100;
    ssl_certificate     /etc/nginx/ssl/sistema-erp-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/sistema-erp-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/www/sistema-erp/frontends/mobile/logs/nginx-access.log;
    error_log  /var/www/sistema-erp/frontends/mobile/logs/nginx-error.log;

    # Processo Next.js (producao, `next start`) mantido no ar pelo
    # supervisor-mobile.conf, escutando apenas em loopback na porta 3001.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
