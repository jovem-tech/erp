[program:sistema-erp-mobile]
process_name=%(program_name)s
command=/usr/bin/node /var/www/sistema-erp/frontends/mobile/scripts/run-next.mjs start
directory=/var/www/sistema-erp/frontends/mobile
# HOSTNAME e obrigatorio: sem ele o Next.js faz bind em 0.0.0.0 e o app
# fica acessivel em http://<ip>:3001 SEM TLS, contornando o nginx da 8444.
environment=PORT="3001",HOSTNAME="127.0.0.1",NODE_ENV="production"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/sistema-erp/frontends/mobile/logs/mobile.log
stopwaitsecs=10
